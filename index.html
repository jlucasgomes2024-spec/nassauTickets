<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nassauTickets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>nassauTickets</h1>
    <p>Laboratório de Análises Clínicas</p>
  </div>
  <div id="clock"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="totem">AC · Totem</button>
  <button class="tab" data-tab="atendente">AA · Atendente</button>
  <button class="tab" data-tab="painel">Painel</button>
  <button class="tab" data-tab="sistema">AS · Sistema</button>
</nav>

<main>
  <section id="totem" class="view active">
    <div class="hero">
      <h2>Emissão de senha</h2>
      <p>Escolha o tipo de atendimento.</p>
    </div>
    <div class="ticket-grid">
      <button class="ticket-button priority" data-type="SP">
        <strong>SP</strong><span>Senha Prioritária</span>
      </button>
      <button class="ticket-button exam" data-type="SE">
        <strong>SE</strong><span>Retirada de Exames</span>
      </button>
      <button class="ticket-button general" data-type="SG">
        <strong>SG</strong><span>Senha Geral</span>
      </button>
    </div>
    <div id="issued" class="issued-card hidden"></div>
  </section>

  <section id="atendente" class="view">
    <div class="hero">
      <h2>Agente Atendente</h2>
      <p>Controle do atendimento no guichê.</p>
    </div>
    <div class="toolbar">
      <label>Guichê
        <input id="counter" value="G1" maxlength="20">
      </label>
      <button id="callNext" class="primary">Chamar próxima senha</button>
    </div>
    <div id="current"></div>
    <div id="waitingList"></div>
  </section>

  <section id="painel" class="view">
    <div class="panel-screen">
      <span class="panel-label">ÚLTIMAS CHAMADAS</span>
      <div id="bigLast" class="big-last">—</div>
      <div id="panelList" class="panel-list"></div>
    </div>
  </section>

  <section id="sistema" class="view">
    <div class="hero">
      <h2>Agente Sistema</h2>
      <p>Visão operacional, estados e encerramento do expediente.</p>
    </div>
    <div id="stats" class="stats"></div>
    <div class="system-grid">
      <div class="card">
        <h3>Fila atual</h3>
        <div id="systemQueue"></div>
      </div>
      <div class="card">
        <h3>Atendimentos em andamento</h3>
        <div id="systemServing"></div>
      </div>
    </div>
    <div class="danger-zone">
      <button id="closeDay" class="danger">Encerrar expediente</button>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
